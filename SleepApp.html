<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>睡眠アプリ</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    font-family: sans-serif;
    background: #e9e9e9;
}

header {
    height: 100px;
    background: #7d88e8;
    display: flex;
    align-items: center;
    padding-left: 30px;
}

.title {
    font-size: 50px;
    color: black;
}

.container {
    display: flex;
    gap: 30px;
    padding: 30px;
}

.left {
    width: 50%;
}

.right {
    width: 50%;
    background: white;
    padding: 20px;
    border-radius: 10px;
}

.date {
    font-size: 40px;
    margin-bottom: 30px;
}

.input-area {
    font-size: 30px;
    line-height: 2.5;
}

input[type="time"] {
    width: 180px;
    height: 40px;
    font-size: 25px;
}

button {
    width: 220px;
    height: 60px;
    font-size: 25px;
    margin-top: 30px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #7d88e8;
    color: white;
}

.result {
    margin-top: 40px;
    font-size: 35px;
    line-height: 2;
}

.comment {
    margin-top: 30px;
    background: #d3d3d3;
    padding: 20px;
    font-size: 28px;
    border-radius: 10px;
}

.graph-title {
    text-align: center;
    font-size: 30px;
    margin-bottom: 20px;
}

</style>

</head>

<body>

<header>
    <div class="title">睡眠</div>
</header>

<div class="container">

    <div class="left">

        <div class="date" id="todayDate"></div>

        <div class="input-area">

            就寝時間：
            <input type="time" id="sleepInput">

            <br>

            起床時間：
            <input type="time" id="wakeInput">

        </div>

        <button onclick="calculateSleep()">
            記録する
        </button>

        <div class="result">

            睡眠時間：
            <span id="sleepResult">00時間00分</span>

            <br>

            平均睡眠時間：
            <span id="averageSleep">00時間00分</span>

        </div>

        <div class="comment" id="comment">
            コメント
        </div>

    </div>

    <div class="right">

        <div class="graph-title">
            1週間の睡眠時間
        </div>

        <canvas id="sleepChart"></canvas>

    </div>

</div>

<script>

// =========================
// 日付表示
// =========================

const now = new Date();

const week = ["日","月","火","水","木","金","土"];

const year = now.getFullYear();
const month = String(now.getMonth() + 1).padStart(2, '0');
const day = String(now.getDate()).padStart(2, '0');

const todayText = `${year}/${month}/${day}（${week[now.getDay()]}）`;

document.getElementById("todayDate").textContent = todayText;

// =========================
// グラフデータ
// =========================

let sleepData = [0,0,0,0,0,0,0];

// =========================
// グラフ作成
// =========================

const ctx = document.getElementById('sleepChart');

const sleepChart = new Chart(ctx, {

    type: 'bar',

    data: {
        labels: ['日','月','火','水','木','金','土'],

        datasets: [{
            label: '睡眠時間（h）',
            data: sleepData,
            backgroundColor: '#7d88e8',
            borderColor: '#7d88e8',
            borderWidth: 1
        }]
    },

    options: {
        responsive: true,

        scales: {
            y: {
                beginAtZero: true,
                max: 12
            }
        }
    }
});

// =========================
// 睡眠時間計算
// =========================

function calculateSleep() {

    const sleep = document.getElementById("sleepInput").value;
    const wake = document.getElementById("wakeInput").value;

    if (sleep === "" || wake === "") {
        alert("時間を入力してください");
        return;
    }

    let sleepHour = parseInt(sleep.split(":")[0]);
    let sleepMinute = parseInt(sleep.split(":")[1]);

    let wakeHour = parseInt(wake.split(":")[0]);
    let wakeMinute = parseInt(wake.split(":")[1]);

    let sleepTotal = sleepHour * 60 + sleepMinute;
    let wakeTotal = wakeHour * 60 + wakeMinute;

    if (wakeTotal < sleepTotal) {
        wakeTotal += 24 * 60;
    }

    const diff = wakeTotal - sleepTotal;

    const hours = Math.floor(diff / 60);
    const minutes = diff % 60;

    document.getElementById("sleepResult").textContent =
        `${String(hours).padStart(2,'0')}時間${String(minutes).padStart(2,'0')}分`;

    document.getElementById("comment").textContent =
        `今日の睡眠時間は${String(hours).padStart(2,'0')}時間${String(minutes).padStart(2,'0')}分です。`;

    const today = new Date().getDay();

    sleepData[today] = diff / 60;

    sleepChart.update();

    calculateAverage();
}

// =========================
// 平均睡眠時間
// =========================

function calculateAverage() {
    let totalMinutes = 0;
    let count = 0;

    for (let i = 0; i < sleepData.length; i++) {
        if (sleepData[i] > 0) {
            totalMinutes += sleepData[i] * 60; // 分単位で合計
            count++;
        }
    }

    if (count === 0) return;

    const avgTotalMinutes = totalMinutes / count;
    const avgHour = Math.floor(avgTotalMinutes / 60);
    const avgMinute = Math.round(avgTotalMinutes % 60);

    document.getElementById("averageSleep").textContent =
        `${String(avgHour).padStart(2,'0')}時間${String(avgMinute).padStart(2,'0')}分`;
}

</script>

<script type="module" src="./SleepApp.js"></script>
</body>
</html>
