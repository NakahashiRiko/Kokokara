<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>睡眠アプリ</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body {
    margin: 0;
    font-family: sans-serif;
    background: white;
}

header {
    height: 100px;
    background: #7d88e8;
    display: flex;
    align-items: center;
    padding-left: 30px;
    gap: 30px;
}

.back-button {
    text-decoration: none;
    color: #7b807c;
    font-size: 60px;
    line-height: 1;
    font-weight: bold;
    transition: 0.2s;
}

.back-button:hover {
    opacity: 0.7;
}

.title {
    font-size: 50px;
    color: black;
}

.container {
    display: flex;
    gap: 30px;
    padding: 30px;
}

.left {
    width: 50%;
}

.right {
    width: 50%;
    background: #dcdcdc;
    padding: 20px;
    border-radius: 10px;
}

.date {
    font-size: 40px;
    margin-bottom: 30px;
}

.input-area {
    font-size: 30px;
    line-height: 2.5;
}

.status-display {
    font-size: 26px;

    color: black;
    background: #dcdcdc;

    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
    border-left: 5px solid #7d88e8;
}

input[type="time"] {
    width: 220px;
    height: 40px;
    font-size: 25px;
    font-family: "Yu Gothic", "Meiryo", sans-serif;
}

button {
    width: 260px;
    height: 60px;
    font-size: 25px;
    margin-top: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: #7d88e8;
    color: white;
    transition: background 0.2s;
}

button.wake-mode {
    background: #e87d7d;
}

.result {
    margin-top: 40px;
    font-size: 35px;
    line-height: 2;
}

.comment {
    margin-top: 30px;
    background: #d3d3d3;
    padding: 20px;
    font-size: 28px;
    border-radius: 10px;
    white-space: pre-wrap;
}

.graph-title {
    text-align: center;
    font-size: 30px;
    margin-bottom: 20px;
}

</style>

</head>

<body>

<header>

    <a href="frontEnd/src/index.html" class="back-button">
        ＜
    </a>
    <div class="title">睡眠</div>

</header>

<div class="container">

    <div class="left">

        <div class="date" id="todayDate"></div>

        <div class="status-display" id="statusDisplay">
            まだ就寝記録がありません。
        </div>

        <div class="input-area">

            起床時間：
            <input type="time" id="wakeInput">

        </div>

        <button id="actionButton" onclick="handleSleepButton()">
            就寝する
        </button>

        <div class="result">

            睡眠時間：
            <span id="sleepResult">00時間00分</span>

            <br>

            就寝時刻：
            <span id="bedTimeResult">00:00</span>

            <br>

            平均睡眠時間：
            <span id="averageSleep">00時間00分</span>

        </div>

        <div class="comment" id="comment">
            コメント
        </div>

    </div>

    <div class="right">

        <div class="graph-title">
            1週間の睡眠時間
        </div>

        <canvas id="sleepChart"></canvas>

    </div>

</div>

<script>

// =========================
// URLから日付取得
// =========================

const params = new URLSearchParams(location.search);

const selectedDate = params.get("date");

if (!selectedDate) {

    document.getElementById("todayDate").textContent =
    "日付が選択されていません";
}
else {

    const dateObj = new Date(selectedDate);

    const week = ["日","月","火","水","木","金","土"];

    const year = dateObj.getFullYear();

    const month =
    String(dateObj.getMonth() + 1).padStart(2, '0');

    const day =
    String(dateObj.getDate()).padStart(2, '0');

    const todayText =
    `${year}/${month}/${day}（${week[dateObj.getDay()]}）`;

    document.getElementById("todayDate").textContent =
    todayText;
}

// =========================
// グラフデータ
// =========================

let sleepData = [0,0,0,0,0,0,0];

// =========================
// グラフ作成
// =========================

const ctx = document.getElementById('sleepChart');

const sleepChart = new Chart(ctx, {

    type: 'bar',

    data: {
        labels: ['日','月','火','水','木','金','土'],

        datasets: [{
            label: '睡眠時間（h）',
            data: sleepData,
            backgroundColor: '#7d88e8',
            borderColor: '#7d88e8',
            borderWidth: 1
        }]
    },

    options: {
        responsive: true,

        scales: {
            y: {
                beginAtZero: true,
                max: 12
            }
        }
    }
});

// =========================
// 状態管理
// =========================

let sleepStartTime = null;

let currentStatus = "idle";

let savedDiffMinutes = 0;

// =========================
// ボタン処理
// =========================

function handleSleepButton() {

    const button =
    document.getElementById("actionButton");

    const wakeInput =
    document.getElementById("wakeInput");

    // =====================
    // 1. 就寝開始
    // =====================

    if (currentStatus === "idle") {

        sleepStartTime = new Date();

        currentStatus = "sleeping";

        button.textContent = "タイマー終了";

        button.classList.add("wake-mode");

        document.getElementById("statusDisplay").textContent =
        "睡眠計測中です。";
    }

    // =====================
    // 2. タイマー終了
    // =====================

    else if (currentStatus === "sleeping") {

        const sleepEndTime = new Date();

        const diffMs =
        sleepEndTime - sleepStartTime;

        savedDiffMinutes =
        Math.floor(diffMs / (1000 * 60));

        const hours =
        Math.floor(savedDiffMinutes / 60);

        const minutes =
        savedDiffMinutes % 60;

        // 睡眠時間表示

        document.getElementById("sleepResult").textContent =
        `${String(hours).padStart(2,'0')}時間${String(minutes).padStart(2,'0')}分`;

        currentStatus = "finished";

        button.textContent = "記録する";

        document.getElementById("statusDisplay").textContent =
        "起床時間を入力してください。";
    }

    // =====================
    // 3. 記録処理
    // =====================

    else if (currentStatus === "finished") {

        const wake =
        wakeInput.value;

        if (wake === "") {

            alert("起床時間を入力してください");

            return;
        }

        const hours =
        Math.floor(savedDiffMinutes / 60);

        const minutes =
        savedDiffMinutes % 60;

        // =====================
        // 起床時間から就寝時間を逆算
        // =====================

        let wakeHour =
        parseInt(wake.split(":")[0]);

        let wakeMinute =
        parseInt(wake.split(":")[1]);

        let wakeTotal =
        wakeHour * 60 + wakeMinute;

        let sleepTotal =
        wakeTotal - savedDiffMinutes;

        // 日をまたぐ場合

        if (sleepTotal < 0) {

            sleepTotal += 24 * 60;
        }

        const bedHour =
        Math.floor(sleepTotal / 60);

        const bedMinute =
        sleepTotal % 60;

        // 就寝時間表示

        document.getElementById("bedTimeResult").textContent =
        `${String(bedHour).padStart(2,'0')}:${String(bedMinute).padStart(2,'0')}`;

        // =====================
        // コメント
        // =====================

        let advice = "";

        const sleepHours =
        savedDiffMinutes / 60;

        if (sleepHours < 6) {

            advice =
            "睡眠時間が不足しています。十分な休息を取りましょう。";
        }
        else if (sleepHours >= 7 &&
                 sleepHours <= 9) {

            advice =
            "理想的な睡眠時間です。この生活リズムを維持しましょう。";
        }
        else if (sleepHours > 9) {

            advice =
            "睡眠時間が長めです。生活リズムも意識してみましょう。";
        }
        else {

            advice =
            "あと少し睡眠時間を増やすとより良いです。";
        }

        document.getElementById("comment").textContent =

        `今日の睡眠時間は ${String(hours).padStart(2,'0')}時間${String(minutes).padStart(2,'0')}分です。\n${advice}`;

        // =====================
        // グラフ更新
        // =====================

        const paramsForChart = new URLSearchParams(window.location.search);
        const dateStrForChart = paramsForChart.get("date") || new DataTransferItemList().toISOStrubg().split('T')[0];
        const selected = new Date(dateStrForChart);

        const today =
        selected.getDay();

        sleepData[today] =
        Math.round((savedDiffMinutes / 60) * 10) / 10;

        sleepChart.update();

        calculateAverage();

        // =====================
        // 初期化
        // =====================

        currentStatus = "idle";

        button.textContent = "就寝する";

        button.classList.remove("wake-mode");

        document.getElementById("statusDisplay").textContent =
        "記録が完了しました。";

        if (typeof window.saveToFirestoreViaJS === 'function') {
            window.saveToFirestoreViaJS(wakeInput.value, document.getElementById("bedTimeResult").textContent);
        }

    }
}

// =========================
// 平均睡眠時間
// =========================

function calculateAverage() {

    let totalMinutes = 0;

    let count = 0;

    for (let i = 0; i < sleepData.length; i++) {

        if (sleepData[i] > 0) {

            totalMinutes +=
            sleepData[i] * 60;

            count++;
        }
    }

    if (count === 0) return;

    const avgTotalMinutes =
    totalMinutes / count;

    const avgHour =
    Math.floor(avgTotalMinutes / 60);

    const avgMinute =
    Math.round(avgTotalMinutes % 60);

    document.getElementById("averageSleep").textContent =

    `${String(avgHour).padStart(2,'0')}時間${String(avgMinute).padStart(2,'0')}分`;
}

</script>

<script type="module" src="frontEnd/src/js/SleepApp.js"></script>
</body>
</html>
