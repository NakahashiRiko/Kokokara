<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ココカラ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 上部 -->
    <div class="top">
      <div class="title">ココカラ</div>
      <div class="memo">
        <input type="text" placeholder="メモ">
      </div>
    </div>

    <!-- メイン -->
    <div class="main">
      <!-- 左：カレンダー -->
        <div class="left">
          <div class="date">2026年5月</div>

          <table class="calendar">
            <thead>
              <tr>
                <th class="sun">日</th>
                <th>月</th>
                <th>火</th>
                <th>水</th>
                <th>木</th>
                <th>金</th>            
                <th class="sat">土</th>          
              </tr>        
            </thead>        
            <tbody>          
              <tr>            
                <td></td><td></td><td></td>            
                <td></td><td></td><td>1</td><td class="sat">2</td>          
              </tr>          
              <tr>            
                <td class="sun">3</td><td>4</td><td>5</td>            
                <td class="today">6</td><td>7</td><td>8</td><td class="sat">9</td>          
              </tr>          
              <tr>            
                <td class="sun">10</td><td>11</td><td>12</td>            
                <td>13</td><td>14</td><td>15</td><td class="sat">16</td>          
              </tr>          
              <tr>            
                <td class="sun">17</td><td>18</td><td>19</td>            
                <td>20</td><td>21</td><td>22</td><td class="sat">23</td>          
              </tr>          
              <tr>            
                <td class="sun">24</td><td>25</td><td>26</td>            
                <td>27</td><td>28</td><td>29</td><td class="sat">30</td>          
              </tr>          
              <tr>            
                <td class="sun">31</td><td></td><td></td>            
                <td></td><td></td><td></td><td></td>          
              </tr>        
            </tbody>      
          </table>    
        </div>

      <!-- 右側 -->
      <div class="right">
        <div class="card yellow">
          <div class="card-title">食事</div>
          <div class="meal">
            <span>朝<br>済</span>
            <span>昼<br>済</span>
            <span>晩<br>未</span>
          </div>
        </div>

        <div class="card blue">
          <div class="card-title">睡眠</div>
          <div class="big-text">7時間31分</div>
        </div>

        <div class="card red">
          <div class="card-title">歩数</div>
          <div class="big-text">576歩</div>
        </div>

        <div class="card green">
          <div class="card-title">体調</div>
          <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
