<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ココカラ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <!-- 上部 -->
    <div class="top">
      <div class="title">ココカラ</div>
      <div class="memo">
        <input type="text" placeholder="メモ">
      </div>
    </div>

    <!-- メイン -->
    <div class="main">
      <!-- 左側 -->
      <div class="left">
        <div class="date">2026/05/06（水）</div>

        <table class="calendar">
          <tr>
            <th>日</th><th>月</th><th>火</th><th>水</th>
            <th>木</th><th>金</th><th>土</th>
          </tr>
          <tr>
            <td></td><td></td><td></td><td></td><td></td><td>1</td><td>2</td>
          </tr>
          <tr>
            <td>3</td><td>4</td><td>5</td><td class="today">6</td><td>7</td><td>8</td><td>…</td>
          </tr>
          <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
          <tr><td></td><td></td><td></td><td></td><td></td><td></td><td></td></tr>
        </table>
      </div>

      <!-- 右側 -->
      <div class="right">
        <div class="card yellow">
          <div class="card-title">食事</div>
          <div class="meal">
            <span>朝<br>済</span>
            <span>昼<br>済</span>
            <span>晩<br>未</span>
          </div>
        </div>

        <div class="card blue">
          <div class="card-title">睡眠</div>
          <div class="big-text">7時間31分</div>
        </div>

        <div class="card red">
          <div class="card-title">歩数</div>
          <div class="big-text">576歩</div>
        </div>

        <div class="card green">
          <div class="card-title">体調</div>
          <div class="face">
            <div class="eye left"></div>
            <div class="eye right"></div>
            <div class="mouth"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
