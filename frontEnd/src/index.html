<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ココカラ - ライフログアプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <!-- 6. 上部エリア（ヘッダー） -->
        <header class="top">
            <h1 class="title">ココカラ</h1>
            <div class="memo-area">
                <!-- inputからtextarea（複数行入力対応）に変更しました -->
                <textarea placeholder="メモを入力（複数行の入力、保存機能あり）" class="memo-input"></textarea>
            </div>
        </header>

        <main class="main">
            <!-- 7. 左側エリア（カレンダー） -->
            <aside class="left">
                <div class="date-nav">
                    <button class="nav-btn">◀︎</button>
                    <h2 class="current-date">2026/05/15（金）</h2>
                    <button class="nav-btn">▶︎</button>
                </div>

                <table class="calendar">
                    <thead>
                        <tr>
                            <th>日</th><th>月</th><th>火</th><th>水</th><th>木</th><th>金</th><th>土</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- サンプルの日付データ -->
                        <tr>
                            <td class="other-month">26</td><td class="other-month">27</td><td class="other-month">28</td><td class="other-month">29</td><td class="other-month">30</td><td>1</td><td>2</td>
                        </tr>
                        <tr>
                            <td>3</td><td>4</td><td>5</td><td>6</td><td>7</td><td>8</td><td>9</td>
                        </tr>
                        <tr>
                            <td>10</td><td>11</td><td>12</td><td>13</td><td>14</td><td class="today">15</td><td>16</td>
                        </tr>
                        <tr>
                            <td>17</td><td>18</td><td>19</td><td>20</td><td>21</td><td>22</td><td>23</td>
                        </tr>
                        <tr>
                            <td>24</td><td>25</td><td>26</td><td>27</td><td>28</td><td>29</td><td>30</td>
                        </tr>
                    </tbody>
                </table>
            </aside>

            <!-- 8. 右側エリア（ライフログカード） -->
            <section class="right">
                <!-- 食事カード（リンク化） -->
                <a href="mealApp.html" class="card-link">
                    <div class="card meal">
                        <h3 class="card-title">食事</h3>
                        <div class="card-content">
                            <p>朝：済</p>
                            <p>昼：済</p>
                            <p>晩：未</p>
                        </div>
                    </div>
                </a>

                <!-- 睡眠カード（リンク化） -->
                <a href="SleepApp.html" class="card-link">
                    <div class="card sleep">
                        <h3 class="card-title">睡眠</h3>
                        <div class="card-content">
                            <span class="value">7時間30分</span>
                        </div>
                    </div>
                </a>

                <!-- 歩数カード（リンク化） -->
                <a href="walk.html" class="card-link">
                    <div class="card steps">
                        <h3 class="card-title">歩数</h3>
                        <div class="card-content">
                            <span class="value">8,500歩</span>
                        </div>
                    </div>
                </a>

                <!-- 体調カード（ポップアップの仕掛けがあるため、そのまま維持） -->
                <div class="card condition" tabindex="0">
                    <h3 class="card-title">体調</h3>
                    <div class="card-content">
                        <!-- 💡 仕掛け：5段階の隠しラジオボタン -->
                        <input type="radio" name="condition-select" id="cond-5" class="cond-radio" checked>
                        <input type="radio" name="condition-select" id="cond-4" class="cond-radio">
                        <input type="radio" name="condition-select" id="cond-3" class="cond-radio">
                        <input type="radio" name="condition-select" id="cond-2" class="cond-radio">
                        <input type="radio" name="condition-select" id="cond-1" class="cond-radio">

                        <!-- メイン表示用の顔アイコン -->
                        <div class="face-icon">
                            <div class="eye eye-left"></div>
                            <div class="eye eye-right"></div>
                            <div class="mouth"></div>
                        </div>

                        <!-- クリック時に表示される5段階の吹き出し -->
                        <div class="popup-bubble">
                            <p class="bubble-title">今日の体調は？</p>
                            <div class="status-buttons">
                                <label for="cond-5" class="status-label" title="とても良い">😆</label>
                                <label for="cond-4" class="status-label" title="良い">🙂</label>
                                <label for="cond-3" class="status-label" title="普通">😐</label>
                                <label for="cond-2" class="status-label" title="悪い">🙁</label>
                                <label for="cond-1" class="status-label" title="とても悪い">😢</label>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script type="module" src="./main.js"></script>
</body>
</html>
