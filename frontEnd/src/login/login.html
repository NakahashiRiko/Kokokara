<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>目標を設定しよう！</title>
  <link rel="stylesheet" href="login.css">
</head>

<body>
  <div class="welcome-header">
    ✨ ココカラアプリへようこそ！ 🏃‍♀️
  </div>

  <div class="container">
    <div class="form-card">
    <h1>目標を設定しよう！</h1>

    <form id="goal-form">
      <div class="section">
        <h2>歩数</h2>
        <div class="input-row">
          <label for="steps">一日の目標：</label>
          <input type="number" id="steps" min="0" placeholder="0" required>
          <span>歩</span>
        </div>
      </div>

      <div class="section">
        <h2>食事</h2>
        
        <div class="input-row time-row">
          <label for="breakfast-time">朝食時間：</label>
          <input type="time" id="breakfast-time" required>
        </div>

        <div class="input-row time-row">
          <label for="lunch-time">昼食時間：</label>
          <input type="time" id="lunch-time" required>
        </div>

        <div class="input-row time-row">
          <label for="dinner-time">夕食時間：</label>
          <input type="time" id="dinner-time" required>
        </div>
      </div>

      <div class="button-container">
        <button type="submit" class="btn-guest">ゲストで参加</button>
      </div>
    </form>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
