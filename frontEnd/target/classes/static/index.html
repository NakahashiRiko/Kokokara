<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ココカラ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- 左エリア -->
  <div class="left">
    <h1>ココカラ</h1>

    <div class="date-box">
      ◀ 2026/05/06（水） ▶
    </div>

    <table class="calendar">
      <tr>
        <th>日</th><th>月</th><th>火</th><th>水</th>
        <th>木</th><th>金</th><th>土</th>
      </tr>
      <tr>
        <td></td><td></td><td></td><td class="today">6</td><td>7</td><td>8</td><td>9</td>
      </tr>
    </table>
  </div>

  <!-- 右エリア -->
  <div class="right">

    <input class="memo" type="text" placeholder="メモ">

    <div class="card-row">
      <div class="card food">
        <h2>食事</h2>
        朝：済<br>
        昼：済<br>
        晩：未
      </div>

      <div class="card sleep">
        <h2>睡眠</h2>
        <span class="big">7時間31分</span>
      </div>
    </div>

    <div class="card-row">
      <div class="card walk">
        <h2>歩数</h2>
        <span class="big">576歩</span>
      </div>

      <div class="card condition">
        <h2>体調</h2>
        <div class="face">– –</div>
      </div>
    </div>

  </div>

</div>

</body>
</html>
