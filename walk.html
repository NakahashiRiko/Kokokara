<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>歩数</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            margin:0;
            background:#efefef;
            font-family:sans-serif;
        }

        header{
            height:90px;
            background:#f58f8f;
            display:flex;
            align-items:center;
            padding:0 30px;
            font-size:50px;
            font-weight:bold;
        }

        .back{
            color:#7b807c;
            font-size:60px;
            margin-right:15px;
            text-decoration:none;
        }

        .main{
            display:flex;
            background:white;
            min-height:calc(100vh - 90px);
        }

        .left,
        .right{
            padding:20px 40px;
            box-sizing:border-box;
        }

        .left{
            width:45%;
            display:flex;
            flex-direction:column;
            gap:10px;
        }

        .right{
    width:55%;

    display:flex;
    align-items:stretch;
}

        .date{
            font-size:42px;
            text-align:left;
            margin-bottom:10px;
        }

        .status-display{
            font-size:26px;
            color:black;
            background:#dcdcdc;
            padding:15px;
            border-radius:10px;
            margin-bottom:20px;
            border-left:5px solid #f58f8f;
            text-align:left;
        }

        .row{
            display:flex;
            justify-content:flex-start;
            align-items:center;
            font-size:35px;
            margin-top:10px;
        }

        .label{
            width:300px;
            text-align:left;
        }

        .value{
            width:250px;
            text-align:left;
        }

        .target-text{
            font-size:32px;
        }

        input{
            width:100px;
            height:50px;
            font-size:30px;
            text-align:center;
        }

        input:disabled{
            background:transparent;
            color:black;
            border:none;
            font-size:32px;
        }

        #saveButton{
            width:220px;
            height:65px;
            border:none;
            border-radius:15px;
            background:#f58f8f;
            color:white;
            font-size:30px;
            font-weight:bold;
            cursor:pointer;
            margin-top:10px;
        }

        .avg-box{
            margin-top:15px;
            text-align:left;
            font-size:35px;
            line-height:1.5;
        }

        .avg-date{
            margin-bottom:10px;
        }

       .comment-box{
    margin-top:30px;
    background:#d3d3d3;
    padding:20px;
    border-radius:10px;
}

        .comment-title{
            font-size:28px;
            font-weight:bold;
            margin-bottom:15px;
            text-align:left;
        }

       .comment{
    font-size:28px;
    white-space:pre-wrap;
    text-align:left;
    line-height:1.6;
}

        .graph-box{
            background:#dcdcdc;
            width:100%;
            padding:20px;
            border-radius:10px;
            flex:1;
        }

    </style>

</head>

<body>

    <header>

        <a
            href="frontEnd/src/index.html"
            class="back"
        >
            ＜
        </a>

        歩数

    </header>

    <div class="main">

        <div class="left">

            <div
                class="date"
                id="selectedDate"
            >
            </div>

            <div
                class="status-display"
                id="statusDisplay"
            >
                まだ歩数記録がありません。
            </div>

            <div class="row">

                <div class="label">
                    目　　　標：
                </div>

                <div class="value">

                    <span
                        class="target-text"
                        id="targetText"
                    >
                    </span>

                    歩

                </div>

            </div>

            <div class="row">

                <div
                    class="label"
                    id="stepLabel"
                >
                </div>

                <div class="value">

                    <input
                        type="number"
                        id="stepInput"
                        value=""
                    >

                    歩

                </div>

            </div>

            <button id="saveButton">
                記録する
            </button>

            <div class="avg-box">

                <div
                    class="avg-date"
                    id="avgLabel"
                >
                </div>

                <div id="avgText"></div>

            </div>

            <div class="comment-box">

                <div class="comment-title">
                    コメント
                </div>

                <div
                    class="comment"
                    id="comment"
                >
                </div>

            </div>

        </div>

        <div class="right">

            <div class="graph-box">

                <canvas id="chart"></canvas>

            </div>

        </div>

    </div>

    <script>

        const params =
            new URLSearchParams(location.search);

        const dateParam =
            params.get("date");

        let pageDate;

if(dateParam){

    const splitDate =
        dateParam.split("-");

    pageDate =
        new Date(
            Number(splitDate[0]),
            Number(splitDate[1]) - 1,
            Number(splitDate[2])
        );
}
else{

    pageDate = new Date();
}
        const today =
            new Date();

        const selectedDay =
            pageDate.getDate();

        const week =
            ["日","月","火","水","木","金","土"];

        document.getElementById("stepLabel").innerText =
            String(pageDate.getMonth() + 1)
            +
            "月"
            +
            String(pageDate.getDate())
            +
            "日の歩数：";

        let target = 5000;

const sessionData =
    sessionStorage.getItem('guestGoalData');

if (sessionData) {

    const guestData =
        JSON.parse(sessionData);

    if (guestData.targetSteps) {

        target =
            Number(guestData.targetSteps);

        console.log(
            "🎯 ログイン画面から目標歩数を引き継ぎました:",
            target
        );
    }
}
        document.getElementById("targetText").innerText =
            target;

        document.getElementById("selectedDate").innerText =
    `${pageDate.getFullYear()}/${
        String(pageDate.getMonth() + 1).padStart(2,"0")
    }/${
        String(pageDate.getDate()).padStart(2,"0")
    }（${week[pageDate.getDay()]}）`;

        if(
            pageDate.toDateString()
            !==
            today.toDateString()
        ){

            document.getElementById("saveButton").style.display =
                "none";

            document.getElementById("stepInput").disabled =
                true;
        }

        const selectedKey =
            pageDate.getFullYear()
            +
            "-"
            +
            String(pageDate.getMonth() + 1).padStart(2,"0")
            +
            "-"
            +
            String(pageDate.getDate()).padStart(2,"0");

        const stepData = {};

        for(let i = 30; i >= 0; i--){

            let d =
                new Date();

            d.setDate(
                today.getDate() - i
            );

            let y =
                d.getFullYear();

            let m =
                String(d.getMonth() + 1)
                .padStart(2,"0");

            let day =
                String(d.getDate())
                .padStart(2,"0");

            let key =
                y
                +
                "-"
                +
                m
                +
                "-"
                +
                day;

            let saved =
                localStorage.getItem(key);

            stepData[key] =
                saved
                ?
                Number(saved)
                :
                0;
        }

        let savedStep =
            localStorage.getItem(selectedKey);

        if(savedStep && Number(savedStep) !== 0){

            document.getElementById("stepInput").value =
                savedStep;

            document.getElementById("statusDisplay").innerText =
                "記録済みです。";
        }

        function updateAverage(){

            let todayDay =
                today.getDay();

            let thisSunday =
                new Date(today);

            thisSunday.setDate(
                today.getDate() - todayDay
            );

            let sum = 0;

            let daysCount =
                todayDay + 1;

            for(let i = 0; i < daysCount; i++){

                let d =
                    new Date(thisSunday);

                d.setDate(
                    thisSunday.getDate() + i
                );

                let y =
                    d.getFullYear();

                let m =
                    String(d.getMonth() + 1)
                    .padStart(2,"0");

                let day =
                    String(d.getDate())
                    .padStart(2,"0");

                let key =
                    y
                    +
                    "-"
                    +
                    m
                    +
                    "-"
                    +
                    day;

                sum +=
                    stepData[key] || 0;
            }

            let avg =
                Math.floor(sum / daysCount);

            document.getElementById("avgLabel").innerText =
                String(thisSunday.getMonth() + 1)
                .padStart(2,"0")
                +
                "/"
                +
                String(thisSunday.getDate())
                .padStart(2,"0")
                +
                " ~ "
                +
                String(pageDate.getMonth() + 1)
                .padStart(2,"0")
                +
                "/"
                +
                String(selectedDay)
                .padStart(2,"0");

            document.getElementById("avgText").innerText =
                "の平均歩数："
                +
                avg
                +
                "歩";
        }

        let chart;

        function createChart(){

            let labels = [];

            let graphData = [];

            let todayDay =
                today.getDay();

            for(let i = todayDay; i >= 0; i--){

                let d =
                    new Date(pageDate);

                d.setDate(
                    d.getDate() - i
                );

                let y =
                    d.getFullYear();

                let m =
                    String(d.getMonth() + 1)
                    .padStart(2,"0");

                let day =
                    String(d.getDate())
                    .padStart(2,"0");

                let key =
                    y
                    +
                    "-"
                    +
                    m
                    +
                    "-"
                    +
                    day;

                labels.push(
                    Number(day) + "日"
                );

                graphData.push(
                    stepData[key] || 0
                );
            }

            if(chart){

                chart.destroy();
            }

            chart =
                new Chart(
                    document.getElementById("chart"),
                    {
                        type:"bar",

                        data:{
                            labels:labels,

                            datasets:[
                                {
                                    data:graphData
                                }
                            ]
                        },

                        options:{
                            responsive:true,


                            plugins:{
                                legend:{
                                    display:false
                                },

                                tooltip:{
                                    enabled:false
                                }
                            },

                            scales:{
                                y:{
                                    beginAtZero:true,

                                    suggestedMax:
                                        Math.max(...graphData) + 1000,

                                    ticks:{
                                        callback:function(value){

                                            return value + "歩";
                                        }
                                    }
                                }
                            }
                        },

                        plugins:[
                            {
                                afterDatasetsDraw(chart){

                                    const { ctx } = chart;

                                    ctx.save();

                                    ctx.font =
                                        "16px sans-serif";

                                    ctx.textAlign =
                                        "center";

                                    ctx.textBaseline =
                                        "bottom";

                                    chart.data.datasets.forEach(
                                        (dataset,i)=>{

                                            const meta =
                                                chart.getDatasetMeta(i);

                                            meta.data.forEach(
                                                (bar,index)=>{

                                                    const value =
                                                        dataset.data[index];

                                                    ctx.fillText(
                                                        value,
                                                        bar.x,
                                                        bar.y - 8
                                                    );
                                                }
                                            );
                                        }
                                    );
                                }
                            }
                        ]
                    }
                );
        }

        function updatePage(){

            let inputValue =
                document.getElementById("stepInput").value;

            let currentTarget =
                target;

            let currentStep =
                Number(inputValue);

            localStorage.setItem(
                selectedKey,
                currentStep
            );

            stepData[selectedKey] =
                currentStep;

            if(currentStep === 0){

                document.getElementById("statusDisplay").innerText =
                    "まだ歩数記録がありません。";
            }
            else{

                document.getElementById("statusDisplay").innerText =
                    "記録済みです。";
            }

            updateAverage();

            createChart();

            let diff =
                currentStep - currentTarget;

            if(diff >= 0){

                document.getElementById("comment").innerText =
                    String(pageDate.getMonth() + 1)
                    +
                    "月"
                    +
                    String(pageDate.getDate())
                    +
                    "日の歩数は"
                    +
                    currentStep
                    +
                    "歩です。"
                    +
                    "目標より"
                    +
                    diff
                    +
                    "歩多いです。"
                    +
                    "おめでとうございます！";
            }
            else{

                document.getElementById("comment").innerText =
                    String(pageDate.getMonth() + 1)
                    +
                    "月"
                    +
                    String(pageDate.getDate())
                    +
                    "日の歩数は"
                    +
                    currentStep
                    +
                    "歩です。"
                    +
                    "目標まであと"
                    +
                    Math.abs(diff)
                    +
                    "歩です。"
                    +
                    "もっと頑張りましょう！";
            }
        }

        document
        .getElementById("saveButton")
        .addEventListener(
            "click",
            () => {

                updatePage();

                const finalTarget =
                    target;

                const finalCurrentStep =
                    Number(
                        document.getElementById("stepInput").value
                    ) || 0;

                if(
                    typeof window.updateWalkFirestore
                    ===
                    'function'
                ){

                    window.updateWalkFirestore(
                        finalCurrentStep,
                        finalTarget
                    );
                }
            }
        );

        updateAverage();

        createChart();

        updatePage();

    </script>

    <script
        type="module"
        src="frontEnd/src/js/walk.js"
    >
    </script>

</body>

</html>
