<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>歩数</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body{
            margin:0;
            background:#efefef;
            font-family:sans-serif;
        }
        header{
            height:90px;
            background:#f58f8f;
            display:flex;
            align-items:center;
            padding:0 30px;
            font-size:50px;
            font-weight:bold;
        }
        .back{
            color:#7b807c;
            font-size:60px;
            margin-right:15px;
            text-decoration:none;
        }
        .main{
            display:flex;
            background:white;
            min-height:calc(100vh - 90px);
        }
        .left,
        .right{
            padding:20px 40px 20px 40px;
            box-sizing:border-box;
        }
        .left{
            width:45%;
            display:flex;
            flex-direction:column;
            gap:8px;
        }
        .right{
            width:55%;
        }
        .date{
            font-size:42px;
            text-align:center;
            margin-bottom:15px;
        }
        .row{
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:35px;
            margin-top:10px;
        }
        .label{
            width:260px;
            text-align:right;
            padding-right:20px;
            box-sizing:border-box;
        }
        .value{
            width:240px;
            text-align:left;
        }
        .target-text{
            font-size:32px;
        }
        .avg-box{
            margin-top:5px;
            text-align:center;
            font-size:35px;
            line-height:1.5;
            margin-left:-92px;
        }
        .avg-date{
            margin-bottom:10px;
        }
        input{
            width:85px;
            height:45px;
            font-size:28px;
            text-align:center;
        }
        #saveButton{
            width:220px;
            height:65px;
            border:none;
            border-radius:15px;
            background:#f58f8f;
            color:white;
            font-size:30px;
            font-weight:bold;
            cursor:pointer;
        }
        .comment-box,
.graph-box{
    background:#dcdcdc;
    box-sizing:border-box;
}
.comment-box{
    margin-top:auto;
    height:255px;
    padding:20px 25px 25px 25px;
    display:flex;
    flex-direction:column;
}
.comment-title{
    font-size:28px;
    font-weight:bold;
    margin-bottom:15px;
}
.comment{
    flex:1;
    font-size:26px;
    line-height:1.6;
    text-align:left;
    padding-top:10px;
}
.graph-box{
    width:100%;
    height:700px;
    padding:20px;
}
canvas{
    width:100% !important;
    height:100% !important;
}
    </style>
</head>
<body>
    <header>
        <a href="frontEnd/src/index.html" class="back">＜</a>
        歩数
    </header>
    <div class="main">
        <div class="left">
            <div class="date" id="selectedDate"></div>
            <div class="row">
                <div class="label">
                    目　　　標：
                </div>
                <div class="value">
                    <span
                        class="target-text"
                        id="targetText"
                    >
                    </span>
                    歩
                </div>
            </div>
            <div class="row">
                <div class="label">
                    今日の歩数：
                </div>
                <div class="value">
                    <input
                        type="number"
                        id="stepInput"
                        value="0"
                    >
                    歩
                </div>
            </div>
            <div
                style="
                    text-align:center;
                    margin-top:15px;
                
                "
            >
                <button id="saveButton">
                    記録する
                </button>
            </div>
            <div class="avg-box">
                <div
                    class="avg-date"
                    id="avgLabel"
                >
                </div>
                <div id="avgText"></div>
            </div>
            <div class="comment-box">
                <div class="comment-title">
                    コメント
                </div>
                <div
                    class="comment"
                    id="comment"
                >
                </div>
            </div>
        </div>
        <div class="right">
            <div class="graph-box">
                <canvas id="chart"></canvas>
            </div>
        </div>
    </div>
    <script>
        /* 日付取得 */
        const params =
            new URLSearchParams(location.search);
        const selectedDay =
            params.get("day")
            ?
            Number(params.get("day"))
            :
            new Date().getDate();
        const today =
            new Date();
        const year =
            today.getFullYear();
        const month =
            today.getMonth() + 1;
        /* ホーム画面から目標取得 */
        const target =
            localStorage.getItem("targetSteps")
            ?
            Number(localStorage.getItem("targetSteps"))
            :
            5000;
        document.getElementById("targetText").innerText =
            target;
        /* 表示日付 */
        document.getElementById("selectedDate").innerText =
            year +
            "/" +
            String(month).padStart(2,"0") +
            "/" +
            String(selectedDay).padStart(2,"0");
            /* 今日以外なら記録ボタン非表示 */

            if(selectedDay !== today.getDate()){

                document.getElementById("saveButton").style.display =
                            "none";
            }
        /* 保存キー */
        const selectedKey =
            year +
            "-" +
            String(month).padStart(2,"0") +
            "-" +
            String(selectedDay).padStart(2,"0");
        /* データ */
        const stepData = {};
        /* 30日分読み込み */
        for(let i = 30; i >= 0; i--){
            let d =
                new Date();
            d.setDate(
                today.getDate() - i
            );
            let y =
                d.getFullYear();
            let m =
                String(d.getMonth()+1)
                .padStart(2,"0");
            let day =
                String(d.getDate())
                .padStart(2,"0");
            let key =
                y +
                "-" +
                m +
                "-" +
                day;
            let saved =
                localStorage.getItem(key);
            stepData[key] =
                saved
                ?
                Number(saved)
                :
                0;
        }
        /* 保存済み歩数 */
        let savedStep =
            localStorage.getItem(selectedKey);
        if(savedStep){
            document.getElementById("stepInput").value =
                savedStep;
        }
        /* 平均更新関数 */
        function updateAverage(){
            let todayDay =
                today.getDay();
            let thisSunday =
                new Date(today);
            thisSunday.setDate(
                today.getDate() - todayDay
            );
            let sum = 0;
            let daysCount =
                todayDay + 1;
            for(let i = 0; i < daysCount; i++){
                let d =
                    new Date(thisSunday);
                d.setDate(
                    thisSunday.getDate() + i
                );
                let y =
                    d.getFullYear();
                let m =
                    String(d.getMonth()+1)
                    .padStart(2,"0");
                let day =
                    String(d.getDate())
                    .padStart(2,"0");
                let key =
                    y +
                    "-" +
                    m +
                    "-" +
                    day;
                sum +=
                    stepData[key] || 0;
            }
            let avg =
                Math.floor(sum / daysCount);
            document.getElementById("avgLabel").innerText =
                String(thisSunday.getMonth()+1)
                .padStart(2,"0")

                +

                "/"

                +

                String(thisSunday.getDate())
                .padStart(2,"0")

                +

                " ~ "

                +

                String(month)
                .padStart(2,"0")

                +

                "/"

                +

                String(selectedDay)
                .padStart(2,"0");
            document.getElementById("avgText").innerText =
                "の平均歩数：" +
                avg +
                "歩";
        }
        /* グラフ */
        let chart;
        function createChart(){
            let labels = [];
            let graphData = [];
            let todayDay =
                today.getDay();
            for(let i = todayDay; i >= 0; i--){
                let d =
                    new Date(
                        year,
                        month - 1,
                        selectedDay
                    );
                d.setDate(
                    d.getDate() - i
                );
                let y =
                    d.getFullYear();
                let m =
                    String(d.getMonth()+1)
                    .padStart(2,"0");
                let day =
                    String(d.getDate())
                    .padStart(2,"0");
                let key =
                    y +
                    "-" +
                    m +
                    "-" +
                    day;
                labels.push(
                    Number(day) + "日"
                );
                graphData.push(
                    stepData[key] || 0
                );
            }
            if(chart){
                chart.destroy();
            }
            chart =
                new Chart(
                    document.getElementById("chart"),
                    {
                        type:"bar",
                        data:{
                            labels:labels,
                            datasets:[
                                {
                                    data:graphData
                                }
                            ]
                        },
                        options:{
                            responsive:true,
                            maintainAspectRatio:false,
                            plugins:{
                                legend:{
                                    display:false
                                },

                                tooltip:{
                                    enabled:false
                                }
                            },
                            scales:{
                                y:{
                                    beginAtZero:true,

                                    suggestedMax:
                                        Math.max(...graphData) + 1000,

                                    ticks:{
                                        callback:function(value){

                                            return value + "歩";
                                        }
                                    }
                                }
                            }
                        },
                        plugins:[
                            {
                                afterDatasetsDraw(chart){
                                    const { ctx } = chart;
                                    ctx.save();
                                    ctx.font =
                                        "16px sans-serif";
                                    ctx.textAlign =
                                        "center";
                                    ctx.textBaseline =
                                        "bottom";
                                    chart.data.datasets.forEach(
                                        (dataset,i)=>{
                                            const meta =
                                                chart.getDatasetMeta(i);
                                            meta.data.forEach(
                                                (bar,index)=>{
                                                    const value =
                                                        dataset.data[index];
                                                    ctx.fillText(
                                                        value,
                                                        bar.x,
                                                        bar.y - 8
                                                    );
                                                }
                                            );
                                        }
                                    );
                                }
                            }
                        ]
                    }
                );
        }
        /* 更新 */
        function updatePage(){
    let inputValue =
        document.getElementById("stepInput").value;
        let currentTarget = target;
    /* 未入力チェック */
    if(inputValue === ""){
        alert("今日の歩数を入力してください。");
        return;
    }
    let currentStep = Number(inputValue);
    localStorage.setItem(selectedKey,currentStep);
    stepData[selectedKey] = currentStep;
            /* 平均更新 */
            updateAverage();
            createChart();
            /* コメント */
            let diff =
                currentStep - currentTarget;
            if(diff >= 0){
                document.getElementById("comment").innerText =
                    "今日の歩数は" +
                    currentStep +
                    "歩です。"
                    +
                    "目標より" +
                    diff +
                    "歩多いです。"
                    +
                    "おめでとうございます！";
            }
            else{
                document.getElementById("comment").innerText =
                    "今日の歩数は" +
                    currentStep +
                    "歩です。"
                    +
                    "目標まであと" +
                    Math.abs(diff) +
                    "歩です。"
                    +
                    "もっと頑張りましょう！";
            }
        }
        /* ボタン */
        document
            .getElementById("saveButton")
            .addEventListener(
                "click",
                () => {
                updatePage();
                const finalTarget = target;
                const finalCurrentStep = Number(document.getElementById("stepInput").value) || 0;
                if (typeof window.updateWalkFirestore === 'function') {
                    window.updateWalkFirestore(finalCurrentStep, finalTarget);
                    }
                }
                
            );
        /* 初回表示 */
        updateAverage();
        createChart();

        if(document.getElementById("stepInput").value !=="0"){
            updatePage();
        }
    </script>
    <script type="module" src="frontEnd/src/js/walk.js"></script>
</body>
</html>
